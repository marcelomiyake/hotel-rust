server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location = /api/hotels {
        proxy_pass http://hotel-service:8080/v1/hotels;
        proxy_set_header X-Staff-Token $http_x_staff_token;
    }
    location /api/hotels/ {
        rewrite ^/api/hotels(.*)$ /v1/hotels$1 break;
        proxy_pass http://hotel-service:8080;
        proxy_set_header X-Staff-Token $http_x_staff_token;
    }
    location = /api/rates {
        rewrite ^/api/rates$ /v1/rates break;
        proxy_pass http://rate-service:8080;
    }
    location = /api/reservations/availability {
        proxy_pass http://reservation-service:8080/v1/availability$is_args$args;
    }
    location /api/reservation-journeys {
        rewrite ^/api/reservation-journeys(.*)$ /v1/reservation-journeys$1 break;
        proxy_pass http://reservation-service:8080;
    }
    location /api/reservations {
        rewrite ^/api/reservations(.*)$ /v1/reservations$1 break;
        proxy_pass http://reservation-service:8080;
    }
    location /api/admin/ {
        rewrite ^/api/admin(.*)$ /v1/admin$1 break;
        proxy_pass http://management-service:8080;
        proxy_set_header X-Staff-Token $http_x_staff_token;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
